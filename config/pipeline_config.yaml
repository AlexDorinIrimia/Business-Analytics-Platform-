# Pipeline Configuration
# This file controls the behavior of the data pipeline

# Data paths
paths:
  raw_data: "/dbfs/FileStore/business-analytics/raw/"
  processed_data: "/dbfs/FileStore/business-analytics/processed/"
  output_data: "/dbfs/FileStore/business-analytics/output/"
  
  # Specific data sources
  sales_transactions: "${paths.raw_data}sales/"
  customers: "${paths.raw_data}customers/"
  products: "${paths.raw_data}products/"
  inventory: "${paths.raw_data}inventory/"

# Spark configuration
spark:
  app_name: "BusinessAnalyticsPipeline"
  shuffle_partitions: 200
  enable_adaptive_execution: true
  
  # Performance tuning
  broadcast_threshold: 10485760  # 10MB
  max_records_per_file: 1000000
  
  # Delta Lake settings
  delta:
    log_cache_size: 100
    checkpoint_interval: 10

# Data quality thresholds
data_quality:
  max_null_percentage: 0.05  # 5% max nulls allowed
  min_record_count: 100
  duplicate_threshold: 0.01  # 1% max duplicates
  
  # Date range validation
  date_range:
    min_date: "2023-01-01"
    max_date: "2026-12-31"

# Business logic parameters
business_rules:
  # Customer segmentation
  customer_segments:
    high_value_threshold: 10000  # CLV threshold for high-value customers
    churn_risk_days: 180  # Days of inactivity indicating churn risk
    
  # Inventory management
  inventory:
    low_stock_threshold: 50
    reorder_quantity_multiplier: 1.5
    
  # Sales analytics
  sales:
    revenue_currency: "USD"
    fiscal_year_start_month: 1  # January
    discount_max_percentage: 0.5  # 50% max discount

# Logging configuration
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
# Pipeline execution
execution:
  enable_caching: true
  checkpoint_enabled: true
  max_retries: 3
  retry_delay_seconds: 60
